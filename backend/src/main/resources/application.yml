spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skribl}
    username: ${SPRING_DATASOURCE_USERNAME:skribl}
    password: ${SPRING_DATASOURCE_PASSWORD:skribl}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-secret-dev-secret-dev-secret-123456789012}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
